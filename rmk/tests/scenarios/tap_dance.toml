# Tap-dance style morse keys, ported from keyboard_morse_tap_dance_test.rs.
#
# The file-level fixture is the tap-dance one: row 0 holds TD(0), TD(1), TD(2)
# and a plain A, with Kp1..Kp4 behind them on layer 1, driven by the
# HoldOnOtherPress default profile. Tests built on another fixture replace the
# cells they reach through a per-test `keys` block and their morse table
# through a `[test.behavior.morse]` delta.
#
# `[layout].map` carries the hand annotations of the `dusk`/`saurus` regression
# tests. Every other test runs with `unilateral_tap = false`, where hand
# assignment is never consulted.

keyboard = "boards/test_keymap.toml"

keys = [
  { layer = 0, row = 0, col = 0, action = "TD(0)" },
  { layer = 0, row = 0, col = 1, action = "TD(1)" },
  { layer = 0, row = 0, col = 2, action = "TD(2)" },
  { layer = 0, row = 0, col = 3, action = "A" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 1, row = 0, col = 2, action = "Kp3" },
  { layer = 1, row = 0, col = 3, action = "Kp4" },
]

[layout]
map = """
(0,0)    (0,1)  (0,2,L)  (0,3)    (0,4)  (0,5)  (0,6)    (0,7,R)  (0,8,R)  (0,9,R)  (0,10)  (0,11)  (0,12)  (0,13)
(1,0,L)  (1,1)  (1,2)    (1,3,L)  (1,4)  (1,5)  (1,6,R)  (1,7)    (1,8,R)  (1,9,R)  (1,10)  (1,11)  (1,12)  (1,13)
(2,0)    (2,1)  (2,2)    (2,3,L)  (2,4)  (2,5)  (2,6)    (2,7)    (2,8)    (2,9)    (2,10)  (2,11)  (2,12)  (2,13)
(3,0)    (3,1)  (3,2)    (3,3)    (3,4)  (3,5)  (3,6)    (3,7)    (3,8)    (3,9)    (3,10)  (3,11)  (3,12)  (3,13)
(4,0)    (4,1)  (4,2)    (4,3)    (4,4)  (4,5)  (4,6)    (4,7)    (4,8)    (4,9)    (4,10)  (4,11)  (4,12)  (4,13)
"""

[behavior.morse]
unilateral_tap = false
hold_on_other_press = true
hold_timeout = "250ms"
gap_timeout = "250ms"

# Per-morse profiles of the `dusk` and `saurus` regression fixtures. Named
# profiles are shared by every test; only the morses that name one use them.
[behavior.morse.profiles.dusk_normal]
normal_mode = true

[behavior.morse.profiles.dusk_hold_on_other]
hold_on_other_press = true

[behavior.morse.profiles.dusk_hrm]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"

[behavior.morse.profiles.saurus_hrm]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"
gap_timeout = "250ms"

[behavior.morse.profiles.saurus_short_gap]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"
gap_timeout = "100ms"

[behavior.morse.profiles.saurus_short_gap_no_flow]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"
gap_timeout = "100ms"
enable_flow_tap = false

[[behavior.morse.morses]]
tap = "A"
hold = "B"
hold_after_tap = "C"
double_tap = "D"

[[behavior.morse.morses]]
tap = "X"
hold = "Y"
hold_after_tap = "Z"
double_tap = "Space"

[[behavior.morse.morses]]
tap = "Kp1"
hold = "LShift"
hold_after_tap = "Kp2"
double_tap = "LGui"

[[test]]
name = "tap"
steps = [
  { delay = 150 },
  { press = [0, 0] },     # Press TD(0)
  { delay = 10 },
  { release = [0, 0] },
  { expect = ["A"] },
  { expect = "empty" },
]

