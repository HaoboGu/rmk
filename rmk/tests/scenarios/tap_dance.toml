# Tap-dance style morse keys, ported from keyboard_morse_tap_dance_test.rs.
#
# The fixture is the shared split board's tap-dance cells — TD(0)@(1,2),
# TD(1)@(3,8), TD(2)@(3,11) — plus a plain A@(1,0) and E@(1,4) as the normal
# keys rolled against them. The HoldOnOtherPress default profile drives them;
# tests that need another shape replace the morse table through a
# `[test.behavior.morse]` delta. A delta with fewer morses than the board has
# TD cells leaves the extra cells inert, and no test presses them.
#
# Every test runs with `unilateral_tap = false`, where hand assignment is never
# consulted. The `dusk`/`saurus` real-layout regressions live in
# dusk_saurus.toml, on their own board.

keyboard = "boards/split.toml"

[behavior.morse]
unilateral_tap = false
hold_on_other_press = true

[[behavior.morse.morses]]
tap = "A"
hold = "B"
hold_after_tap = "C"
double_tap = "D"

[[behavior.morse.morses]]
tap = "X"
hold = "Y"
hold_after_tap = "Z"
double_tap = "Space"

[[behavior.morse.morses]]
tap = "Kp1"
hold = "LShift"
hold_after_tap = "Kp2"
double_tap = "LGui"

[[test]]
name = "tap"
steps = [
  { delay = 150 },
  { press = [1, 2] },     # Press TD(0)
  { delay = 10 },
  { release = [1, 2] },
  { expect = ["A"] },
  { expect = "empty" },
]

[[test]]
name = "hold"
steps = [
  { delay = 150 },
  { press = [1, 2] },     # Press TD(0)
  { delay = 300 },
  { release = [1, 2] },
  { expect = ["B"] },
  { expect = "empty" },
]

