  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 1, row = 0, col = 2, action = "Kp3" },
  { layer = 1, row = 0, col = 3, action = "Kp4" },
]
steps = [
  { delay = 10 },
  { press = [0, 3] },
  { delay = 10 },
  { press = [0, 1] },
  { delay = 300 },
  { release = [0, 3] },
  { delay = 300 },
  { release = [0, 1] },
  { expect = ["B"] },
  { expect = "empty" },
  { expect = ["E"] },
  { expect = "empty" },
