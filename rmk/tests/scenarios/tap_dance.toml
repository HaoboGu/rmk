[test.behavior.morse]
hold_on_other_press = false
permissive_hold = true
enable_flow_tap = false
morses = [
  { tap = "A", hold = "B", hold_after_tap = "C", double_tap = "D" },
  { tap = "X", hold = "Y", hold_after_tap = "Z", double_tap = "Space" },
  { morse_actions = [{ pattern = "1", action = "B" }, { pattern = "11", action = "C" }] },
]

# Regression: rapid repeat tapping a FlowTap+EarlyFire key must not jam the key.
#
# TD(0) has tap == hold_after_tap == Backspace and no double_tap, so
# `can_fire_early()` returns true for TAP. The first quick tap fires
# immediately and leaves the key `EarlyFired` in the held buffer; a second tap
# within `prior_idle_time` triggers `FlowTap`, which must drop that stale entry
# before pushing its own or the release report is skipped and the key jams.
[[test]]
name = "flow_tap_after_early_fire_does_not_jam"
keys = [
  { layer = 0, row = 0, col = 0, action = "TD(0)" },
  { layer = 0, row = 0, col = 1, action = "A" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  # This fixture defines a single morse, so drop the file-level TD(2) cell.
  { layer = 0, row = 0, col = 2, action = "Kc2" },
]
steps = [
  { delay = 150 },
  { press = [0, 0] },
  { delay = 30 },
  { release = [0, 0] },
  { delay = 50 },
  { press = [0, 0] },
  { delay = 30 },
  { release = [0, 0] },
  { delay = 300 },
  { press = [0, 1] },
  { delay = 10 },
  { release = [0, 1] },
  { expect = ["Backspace"] },
  { expect = "empty" },
  { expect = ["Backspace"] },
  { expect = "empty" },
  { expect = ["A"] },
  { expect = "empty" },
]
[test.behavior.morse]
enable_flow_tap = true
prior_idle_time = "120ms"
morses = [{ tap = "Backspace", hold = "RShift", hold_after_tap = "Backspace" }]

# Regression: a tap resolved by flow-tap must still allow a hold-after-tap
# continuation, so press-and-hold after that tap repeats the tap action
# (Backspace) instead of resolving as a fresh hold (RShift). Flow-tapped taps
# leave the same `EarlyFired` breadcrumb the early-fire path does.
[[test]]
name = "flow_tapped_tap_then_hold_after_tap"
keys = [
  { layer = 0, row = 0, col = 0, action = "TD(0)" },
  { layer = 0, row = 0, col = 1, action = "A" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 0, row = 0, col = 2, action = "Kc2" },
]
steps = [
  { delay = 200 },
  { tap = [0, 1, 30] },
  { delay = 50 },
  { tap = [0, 0, 30] },
  { delay = 150 },
  { press = [0, 0] },
  { delay = 400 },
  { release = [0, 0] },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["Backspace"] },
  { expect = "empty" },
  { expect = ["Backspace"] },
  { expect = "empty" },
]
[test.behavior.morse]
enable_flow_tap = true
prior_idle_time = "120ms"
morses = [{ tap = "Backspace", hold = "RShift", hold_after_tap = "Backspace" }]

# Regression for a Saurus-shaped `dusk` layout while typing "client".
#
# The final `e`/`n`/`t` roll leaves `N` pressed before `T`, while `E` only
# resolves after `N` is already held. `T` then flow-taps because `E` just
# produced a simple keypress. Even when `N` disables flow-tap through a profile
# override, the later flow-tapped `T` must not overtake it, or the host sees
# "clietn".
[[test]]
name = "saurus_client_roll_with_flow_tap_override_keeps_n_before_t"
keys = [
  { layer = 0, row = 0, col = 2, action = "L" },
  { layer = 0, row = 0, col = 9, action = "Y" },
  { layer = 0, row = 1, col = 0, action = "TD(0)" },
  { layer = 0, row = 1, col = 3, action = "TD(1)" },
  { layer = 0, row = 1, col = 6, action = "TD(2)" },
  { layer = 0, row = 1, col = 8, action = "TD(3)" },
  { layer = 0, row = 1, col = 9, action = "TD(4)" },
  # (0,2) is reachable while layer 1 is active, so keep the board's cell there.
  { layer = 1, row = 0, col = 2, action = "F2" },
]
steps = [
  { delay = 150 },
  { tap = [1, 6, 30] },
  { delay = 30 },
  { tap = [0, 2, 30] },
  { delay = 30 },
  { tap = [1, 9, 30] },
  { delay = 150 },
  { press = [1, 8] },
  { delay = 40 },
  { press = [1, 0] },
  { delay = 30 },
  { release = [1, 8] },
  { delay = 30 },
  { press = [1, 3] },
  { delay = 30 },
  { release = [1, 0] },
  { delay = 30 },
  { release = [1, 3] },
  { delay = 300 },
  { tap = [0, 9, 30] },
  { expect = ["C"] },
  { expect = "empty" },
  { expect = ["L"] },
  { expect = "empty" },
  { expect = ["I"] },
  { expect = "empty" },
  { expect = ["E"] },
  { expect = "empty" },
  { expect = ["N"] },
  { expect = "empty" },
  { expect = ["T"] },
  { expect = "empty" },
  { expect = ["Y"] },
  { expect = "empty" },
]
[test.behavior.morse]
hold_on_other_press = false
normal_mode = true
enable_flow_tap = true
prior_idle_time = "120ms"
morses = [
  { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "saurus_short_gap_no_flow" },
  { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "saurus_hrm" },
  { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "saurus_hrm" },
  { tap = "E", hold = "RCtrl", hold_after_tap = "E", profile = "saurus_hrm" },
  { tap = "I", hold = "RShift", hold_after_tap = "I", profile = "saurus_short_gap" },
]

# Regression for the user's `dusk` layout rollover while typing "could".
#
# C is configured as TD(6) with tap=C and hold_after_tap=C. The physical
# rollover is C down, O down, C up, U down, O up, U up. C must not allow U to
# overtake the already-held O.
[[test]]
name = "dusk_tap_dance_cou_rollover_keeps_o_before_u"
keys = [
  { layer = 0, row = 0, col = 2, action = "L" },
  { layer = 0, row = 0, col = 7, action = "O" },
  { layer = 0, row = 0, col = 8, action = "U" },
  { layer = 0, row = 1, col = 6, action = "TD(6)" },
  { layer = 0, row = 2, col = 3, action = "D" },
  # (0,2) is reachable while layer 1 is active, so keep the board's cell there.
  { layer = 1, row = 0, col = 2, action = "F2" },
]
steps = [
  { delay = 150 },
  { press = [1, 6] },
  { delay = 30 },
  { press = [0, 7] },
  { delay = 30 },
  { release = [1, 6] },
  { delay = 30 },
  { press = [0, 8] },
  { delay = 30 },
  { release = [0, 7] },
  { delay = 30 },
  { release = [0, 8] },
  { delay = 30 },
  { tap = [0, 2, 30] },
  { delay = 30 },
  { tap = [2, 3, 30] },
  { expect = ["C"] },
  { expect = "empty" },
  { expect = ["O"] },
  { expect = ["O", "U"] },
  { expect = ["U"] },
  { expect = "empty" },
  { expect = ["L"] },
  { expect = "empty" },
  { expect = ["D"] },
  { expect = "empty" },
]
[test.behavior.morse]
hold_on_other_press = false
normal_mode = true
enable_flow_tap = true
prior_idle_time = "120ms"
morses = [
  { tap = "Tab", hold = "MO(1)", hold_after_tap = "Tab", profile = "dusk_normal" },
  { tap = "Space", hold = "MO(1)", hold_after_tap = "Space", profile = "dusk_hold_on_other" },
  { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "dusk_hrm" },
  { tap = "S", hold = "LCtrl", hold_after_tap = "S", profile = "dusk_hrm" },
  { tap = "H", hold = "LGui", hold_after_tap = "H", profile = "dusk_hrm" },
  { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "dusk_hrm" },
  { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "dusk_hrm" },
]

