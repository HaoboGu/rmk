# The early-fire fixture: TD(0) at (0,4) has tap == hold_after_tap == Enter and
# no double_tap, so the tap fires immediately on release while hold_after_tap
# still works on re-press. TD(1) at (0,5) is the same shape around E.
[[test]]
name = "early_fire_no_double_press_on_next_key"
keys = [
  { layer = 0, row = 0, col = 0, action = "A" },
  { layer = 0, row = 0, col = 1, action = "B" },
  { layer = 0, row = 0, col = 2, action = "C" },
  { layer = 0, row = 0, col = 3, action = "D" },
  { layer = 0, row = 0, col = 4, action = "TD(0)" },
  { layer = 0, row = 0, col = 5, action = "TD(1)" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 1, row = 0, col = 2, action = "Kp3" },
  { layer = 1, row = 0, col = 3, action = "Kp4" },
  { layer = 1, row = 0, col = 4, action = "Kp5" },
  { layer = 1, row = 0, col = 5, action = "Kp6" },
]
steps = [
  { delay = 10 },
  { press = [0, 4] },     # Press TD(0) morse key
  { delay = 50 },
  { release = [0, 4] },   # Release TD(0) quickly — early fire triggers Enter
  { delay = 50 },
  { press = [0, 0] },     # Press A shortly after
  { delay = 10 },
  { release = [0, 0] },
  { delay = 50 },
  { press = [0, 0] },     # Press A again before the early-fire gap expires
  { delay = 300 },
  { release = [0, 0] },   # Release A after the early-fire gap expires
  { expect = ["Enter"] },
  { expect = "empty" },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["A"] },
  { expect = "empty" },
]
[test.behavior.morse]
morses = [
  { tap = "Enter", hold = "B", hold_after_tap = "Enter" },
  { tap = "E", hold = "LShift", hold_after_tap = "E" },
]

# Re-pressing an early-fired key and holding it resolves as hold-after-tap.
[[test]]
name = "early_fire_then_hold_after_tap"
keys = [
  { layer = 0, row = 0, col = 0, action = "A" },
  { layer = 0, row = 0, col = 1, action = "B" },
  { layer = 0, row = 0, col = 2, action = "C" },
  { layer = 0, row = 0, col = 3, action = "D" },
  { layer = 0, row = 0, col = 4, action = "TD(0)" },
  { layer = 0, row = 0, col = 5, action = "TD(1)" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 1, row = 0, col = 2, action = "Kp3" },
  { layer = 1, row = 0, col = 3, action = "Kp4" },
  { layer = 1, row = 0, col = 4, action = "Kp5" },
  { layer = 1, row = 0, col = 5, action = "Kp6" },
]
steps = [
  { delay = 10 },
  { press = [0, 4] },     # Press TD(0) morse key
  { delay = 50 },
  { release = [0, 4] },   # Release quickly; early fire triggers Enter
  { delay = 50 },
  { press = [0, 4] },     # Re-press TD(0)
  { delay = 300 },
  { release = [0, 4] },   # Hold past timeout; hold-after-tap triggers Enter
  { expect = ["Enter"] },
  { expect = "empty" },
  { expect = ["Enter"] },
  { expect = "empty" },
]
[test.behavior.morse]
morses = [
  { tap = "Enter", hold = "B", hold_after_tap = "Enter" },
  { tap = "E", hold = "LShift", hold_after_tap = "E" },
]

# After early fire, re-pressing and releasing again produces a second tap.
[[test]]
name = "early_fire_then_fire_on_second_tap_with_no_double_tap_config"
keys = [
  { layer = 0, row = 0, col = 0, action = "A" },
  { layer = 0, row = 0, col = 1, action = "B" },
  { layer = 0, row = 0, col = 2, action = "C" },
  { layer = 0, row = 0, col = 3, action = "D" },
  { layer = 0, row = 0, col = 4, action = "TD(0)" },
  { layer = 0, row = 0, col = 5, action = "TD(1)" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 1, row = 0, col = 2, action = "Kp3" },
  { layer = 1, row = 0, col = 3, action = "Kp4" },
  { layer = 1, row = 0, col = 4, action = "Kp5" },
  { layer = 1, row = 0, col = 5, action = "Kp6" },
]
steps = [
  { delay = 10 },
  { press = [0, 5] },     # Press TD(1) morse key
  { delay = 20 },
  { release = [0, 5] },   # Release TD(1) quickly — early fire triggers E
  { delay = 20 },
  { press = [0, 5] },     # Re-press TD(1)
  { delay = 20 },
  { release = [0, 5] },   # quick tap — early fire triggers E again
  { delay = 20 },
  { press = [0, 0] },     # Press A (early-fired key timeout fires, cleans buffer)
  { delay = 20 },
  { release = [0, 0] },
  { expect = ["E"] },
  { expect = "empty" },
  { expect = ["E"] },
  { expect = "empty" },
  { expect = ["A"] },
  { expect = "empty" },
]
[test.behavior.morse]
morses = [
  { tap = "Enter", hold = "B", hold_after_tap = "Enter" },
  { tap = "E", hold = "LShift", hold_after_tap = "E" },
]

# Regression for permissive hold key ordering: press TD(0), press E, release
# TD(0) first. The morse key must resolve as tap (A) before the buffered E
# fires — not E then A.
[[test]]
name = "permissive_hold_morse_released_first_key_order"
keys = [
  { layer = 0, row = 0, col = 0, action = "TD(0)" },
  { layer = 0, row = 0, col = 1, action = "E" },
  { layer = 0, row = 0, col = 2, action = "F" },
  { layer = 0, row = 0, col = 3, action = "A" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 1, row = 0, col = 2, action = "Kp3" },
  { layer = 1, row = 0, col = 3, action = "Kp4" },
]
steps = [
  { delay = 10 },
  { press = [0, 0] },     # Press TD(0) morse key
  { delay = 10 },
  { press = [0, 1] },     # Press E (buffered due to permissive hold)
  { delay = 10 },
  { release = [0, 0] },   # Release TD(0) — morse key released first
  { delay = 300 },
  { release = [0, 1] },   # Release E after gap timeout
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["E"] },
  { expect = "empty" },
]
[test.behavior.morse]
hold_on_other_press = false
permissive_hold = true
morses = [{ tap = "A", hold = "B", hold_after_tap = "C", double_tap = "D" }]

# Permissive hold: releasing the normal key first resolves the morse key as
# hold (B).
[[test]]
name = "permissive_hold_normal_released_first"
keys = [
  { layer = 0, row = 0, col = 0, action = "TD(0)" },
  { layer = 0, row = 0, col = 1, action = "E" },
  { layer = 0, row = 0, col = 2, action = "F" },
  { layer = 0, row = 0, col = 3, action = "A" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 1, row = 0, col = 2, action = "Kp3" },
  { layer = 1, row = 0, col = 3, action = "Kp4" },
]
steps = [
  { delay = 10 },
  { press = [0, 0] },     # Press TD(0) morse key
  { delay = 10 },
  { press = [0, 1] },     # Press E (buffered due to permissive hold)
  { delay = 10 },
  { release = [0, 1] },   # Release E — triggers permissive hold for TD(0)
  { delay = 10 },
  { release = [0, 0] },
  { expect = ["B"] },
  { expect = ["B", "E"] },
  { expect = ["B"] },
  { expect = "empty" },
]
[test.behavior.morse]
hold_on_other_press = false
permissive_hold = true
morses = [{ tap = "A", hold = "B", hold_after_tap = "C", double_tap = "D" }]

# Regression for timeout cleanup: when one morse key times out, buffered normal
# keys must still wait behind any other unresolved morse key.
#
# TD(2) at (0,3) is a hold-only morse whose hold pattern continues into a
# longer hold ("1" -> B, "11" -> C), so reaching the hold timeout does not
# resolve it.
[[test]]
name = "timeout_does_not_flush_normal_keys_before_released_morse"
keys = [
  { layer = 0, row = 0, col = 0, action = "TD(0)" },
  { layer = 0, row = 0, col = 1, action = "E" },
  { layer = 0, row = 0, col = 2, action = "TD(1)" },
  { layer = 0, row = 0, col = 3, action = "TD(2)" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 1, row = 0, col = 2, action = "Kp3" },
  { layer = 1, row = 0, col = 3, action = "Kp4" },
]
steps = [
  { delay = 10 },
  { press = [0, 0] },
  { delay = 10 },
  { press = [0, 1] },
  { delay = 10 },
  { press = [0, 2] },
  { delay = 10 },
  { release = [0, 0] },
  { delay = 300 },
  { release = [0, 2] },
  { delay = 10 },
  { release = [0, 1] },
  { expect = ["Y"] },
  { expect = ["Y", "A"] },
  { expect = ["Y"] },
  { expect = ["Y", "E"] },
  { expect = ["E"] },
  { expect = "empty" },
]
[test.behavior.morse]
hold_on_other_press = false
permissive_hold = true
enable_flow_tap = false
morses = [
  { tap = "A", hold = "B", hold_after_tap = "C", double_tap = "D" },
  { tap = "X", hold = "Y", hold_after_tap = "Z", double_tap = "Space" },
  { morse_actions = [{ pattern = "1", action = "B" }, { pattern = "11", action = "C" }] },
]

# Regression for timeout cleanup: a morse key that reached hold timeout can
