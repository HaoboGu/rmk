# A steno key is a bit index into the 64-bit chord bitmap, so the report says
# which keys are down rather than which keycodes were typed. `STN(..)` only
# exists with the `steno` feature, so the whole file is gated on it.

features = ["steno"]

[layout]
rows = 1
cols = 1
map = "(0,0)"

[[keymap.layer]]
keys = "STN(S1)"

[[test]]
name = "steno_key_sets_its_chord_bit"
steps = [
  { press = [0, 0] },
  { release = [0, 0] },
]
expect = [{ steno = ["S1"] }, { steno = [] }]
