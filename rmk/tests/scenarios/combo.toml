  { delay = 110 },
  { release = [2, 4] },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["N"] } },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

