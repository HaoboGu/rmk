# Combo behavior, ported from keyboard_combo_test.rs.
#
# Combos match on actions, so they fire wherever those keys live on the shared
# split board: W@(1,3) E@(1,4) R@(1,5) T@(1,6); V@(2,3) B@(2,4) N@(2,5)
# M@(2,7) Comma@(2,8) Dot@(2,9); the tap-hold trio TH(A, LShift)@(2,0)
# TH(S, LGui)@(2,1) TH(Z, LAlt)@(2,2); and the mouse keys MouseWheelUp@(0,8)
# MouseAccel2@(0,9).
#
# Standard combos below are shared by most tests; tests with their own combo
# set replace the array via [test.behavior.combo].

keyboard = "boards/split.toml"

[behavior.combo]
timeout = "100ms"
combos = [
  { actions = ["V", "B"], output = "LShift", layer = 0 },
  { actions = ["R", "T"], output = "LAlt", layer = 0 },
  { actions = ["E", "T"], output = "OSM(LShift)", layer = 0 },
  { actions = ["E", "R"], output = "A", layer = 0 },
  { actions = ["E", "R", "T"], output = "Space", layer = 0 },
  { actions = ["V", "B", "T"], output = "Space", layer = 0 },
]

[[test]]
name = "single_key_in_combo"
steps = [
  { delay = 10 },
  { press = [1, 4] },
  { delay = 50 },
  { release = [1, 4] },
  { delay = 10 },
  { press = [1, 5] },
  { delay = 50 },
  { release = [1, 5] },
  { delay = 10 },
  { press = [1, 6] },
  { delay = 10 },
  { release = [1, 6] },
  { expect = ["E"] },
  { expect = "empty" },
  { expect = ["R"] },
  { expect = "empty" },
  { expect = ["T"] },
  { expect = "empty" },
]

[[test]]
name = "combo_timeout_and_ignore"
steps = [
  { delay = 10 },
  { press = [2, 3] },
  { delay = 100 },
  { release = [2, 3] },
  { expect = ["V"] },
  { expect = "empty" },
]

[[test]]
name = "combo_with_mod_then_mod_timeout"
steps = [
  { delay = 10 },
  { press = [2, 3] },     # Press V
  { delay = 10 },
  { press = [2, 4] },     # Press B
  { delay = 50 },
  { press = [1, 5] },     # Press R
  { delay = 90 },
  { release = [1, 5] },   # Release R
  { delay = 150 },
  { release = [2, 3] },   # Release V
  { delay = 170 },
  { release = [2, 4] },   # Release B
  { expect = { mods = ["LShift"] } },                # V + B = LShift
  { expect = { mods = ["LShift"], keys = ["R"] } },  # Press R
  { expect = { mods = ["LShift"] } },                # Release R
  { expect = "empty" },                              # Release V + B
]

[[test]]
name = "combo_with_one_shot_modifier"
steps = [
  { delay = 10 },
  { press = [1, 4] },
  { delay = 10 },
  { press = [1, 6] },
  { delay = 50 },
  { release = [1, 4] },
  { delay = 70 },
  { release = [1, 6] },
  { delay = 50 },
  { press = [1, 4] },
  { delay = 110 },
  { release = [1, 4] },
  { expect = { mods = ["LShift"], keys = ["E"] } },
  { expect = "empty" },
]
[test.behavior.one_shot]
timeout = "300ms"

[[test]]
name = "combo_with_mod"
steps = [
  { delay = 10 },
  { press = [2, 3] },     # V
  { delay = 10 },
  { press = [2, 4] },     # B
  { delay = 50 },
  { press = [2, 5] },     # N, trigger V + B = LShift
  { delay = 70 },
