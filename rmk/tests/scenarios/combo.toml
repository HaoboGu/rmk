# Regression for the overlapping subset combos bug: firing W+E+R must clear the
# fully-pressed-but-not-triggered `W+E` subset, or it later fires as a phantom
# F2 and strands R/modifiers on the host.
[[test]]
name = "subset_combo_wer_then_r_alone"
steps = [
  { delay = 10 },
  { press = [1, 3] },
  { delay = 10 },
  { press = [1, 4] },
  { delay = 10 },
  { press = [1, 5] },
  { delay = 30 },
  { release = [1, 3] },
  { delay = 10 },
  { release = [1, 4] },
  { delay = 10 },
  { release = [1, 5] },
  { delay = 80 },
  { press = [1, 5] },
  { delay = 80 },
  { release = [1, 5] },
  { expect = { mods = ["LCtrl", "LShift"], keys = ["R"] } },
  { expect = "empty" },
  { expect = ["R"] },
  { expect = "empty" },
]
[test.behavior.combo]
timeout = "50ms"
combos = [
  { actions = ["W", "E"], output = "F2", layer = 0 },
  { actions = ["E", "R"], output = "F4", layer = 0 },
  { actions = ["W", "E", "R"], output = "WM(R, LShift | LCtrl)", layer = 0 },
]

# Same, but releasing R first (rolling off the chord) — the ordering that most
# obviously exposed the stranded-R behavior before the fix.
[[test]]
name = "subset_combo_wer_release_r_first"
steps = [
  { delay = 10 },
  { press = [1, 3] },
  { delay = 10 },
  { press = [1, 4] },
  { delay = 10 },
  { press = [1, 5] },
  { delay = 30 },
  { release = [1, 5] },
  { delay = 10 },
  { release = [1, 4] },
  { delay = 10 },
  { release = [1, 3] },
  { delay = 80 },
  { press = [1, 5] },
  { delay = 80 },
  { release = [1, 5] },
  { expect = { mods = ["LCtrl", "LShift"], keys = ["R"] } },
  { expect = "empty" },
  { expect = ["R"] },
  { expect = "empty" },
]
[test.behavior.combo]
timeout = "50ms"
combos = [
  { actions = ["W", "E"], output = "F2", layer = 0 },
  { actions = ["E", "R"], output = "F4", layer = 0 },
  { actions = ["W", "E", "R"], output = "WM(R, LShift | LCtrl)", layer = 0 },
]

# Regression for the stuck mouse-wheel bug: when the combo fires it discards
# the buffered WheelUp press, so it must also consume the WheelUp release —
# otherwise the wheel auto-repeats forever.
[[test]]
name = "mouse_key_combo_does_not_stick_wheel"
steps = [
  { delay = 10 },
  { press = [0, 8] },
  { delay = 10 },
  { press = [0, 9] },
  { delay = 30 },
  { release = [0, 8] },
  { delay = 10 },
  { release = [0, 9] },
  { no_report = 300 },
]
[test.behavior.combo]
timeout = "50ms"
combos = [
  { actions = ["MouseAccel2", "MouseWheelUp"], output = "No", layer = 0 },
]

# Control: a plain WheelUp tap (combo never completes) dispatches on timeout,
# the release balances it, and the wheel goes quiet.
[[test]]
name = "mouse_wheel_tap_settles"
steps = [
  { delay = 10 },
  { press = [0, 8] },
  { delay = 60 },
  { expect_mouse = { wheel = -1 } },
  { delay = 60 },
  { release = [0, 8] },
  { expect_mouse = {} },
  { no_report = 300 },
]
[test.behavior.combo]
timeout = "50ms"
combos = [
  { actions = ["MouseAccel2", "MouseWheelUp"], output = "No", layer = 0 },
]
