# Home row mods (HRM), ported from keyboard_morse_hrm_test.rs.
#
# For HRM, `enable_flow_tap` and `unilateral_tap` are enabled and
# `prior_idle_time` is considered.
#
# Row 0 of the shared board is patched to the morse fixture: A, MT(B, LShift),
# MT(C, LGui), LT(1, D), MT(E, LAlt), with Kp1..Kp5 behind them on layer 1.
# Hand config for those five keys is [Left, Left, Right, Right, Right], carried
# by the (row, col, hand) tokens of the layout map.

keyboard = "boards/test_keymap.toml"

keys = [
  { layer = 0, row = 0, col = 0, action = "A" },
  { layer = 0, row = 0, col = 1, action = "MT(B, LShift)" },
  { layer = 0, row = 0, col = 2, action = "MT(C, LGui)" },
  { layer = 0, row = 0, col = 3, action = "LT(1, D)" },
  { layer = 0, row = 0, col = 4, action = "MT(E, LAlt)" },
  { layer = 1, row = 0, col = 0, action = "Kp1" },
  { layer = 1, row = 0, col = 1, action = "Kp2" },
  { layer = 1, row = 0, col = 2, action = "Kp3" },
  { layer = 1, row = 0, col = 3, action = "Kp4" },
  { layer = 1, row = 0, col = 4, action = "Kp5" },
]

[layout]
map = """
(0,0,L)  (0,1,L)  (0,2,R)  (0,3,R)  (0,4,R)  (0,5)  (0,6)  (0,7)  (0,8)  (0,9)  (0,10)  (0,11)  (0,12)  (0,13)
(1,0)    (1,1)    (1,2)    (1,3)    (1,4)    (1,5)  (1,6)  (1,7)  (1,8)  (1,9)  (1,10)  (1,11)  (1,12)  (1,13)
(2,0)    (2,1)    (2,2)    (2,3)    (2,4)    (2,5)  (2,6)  (2,7)  (2,8)  (2,9)  (2,10)  (2,11)  (2,12)  (2,13)
(3,0)    (3,1)    (3,2)    (3,3)    (3,4)    (3,5)  (3,6)  (3,7)  (3,8)  (3,9)  (3,10)  (3,11)  (3,12)  (3,13)
(4,0)    (4,1)    (4,2)    (4,3)    (4,4)    (4,5)  (4,6)  (4,7)  (4,8)  (4,9)  (4,10)  (4,11)  (4,12)  (4,13)
"""

[behavior.morse]
enable_flow_tap = true
prior_idle_time = "120ms"
unilateral_tap = true
permissive_hold = true
hold_timeout = "250ms"
gap_timeout = "250ms"

[[behavior.morse.morses]]
morse_actions = [
  { pattern = "01", action = "A" },
  { pattern = "1000", action = "B" },
  { pattern = "1010", action = "C" },
  { pattern = "101", action = "K" },
  { pattern = "11", action = "M" },
  { pattern = "111", action = "O" },
  { pattern = "010", action = "R" },
  { pattern = "000", action = "S" },
]

[[test]]
name = "tap"
steps = [
  { delay = 150 },
  { press = [0, 1] },     # Press MT(B, LShift)
  { delay = 100 },
  { release = [0, 1] },
  { expect = ["B"] },
  { expect = "empty" },
]

[[test]]
name = "hold"
steps = [
  { delay = 150 },
  { press = [0, 1] },     # Press MT(B, LShift)
  { delay = 300 },
  { release = [0, 1] },   # Release after hold timeout
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

