[[test]]
name = "rolling_release_order"
steps = [
  { delay = 150 },
  { press = [0, 1] },     # Press MT(B, LShift)
  { delay = 30 },
  { press = [0, 2] },     # Press MT(C, LGui)
  { delay = 30 },
  { press = [0, 0] },     # Press A
  { delay = 50 },
  { release = [0, 1] },   # Released B resolves as tap first
  { delay = 100 },
  { release = [0, 2] },
  { delay = 100 },
  { release = [0, 0] },
  { expect = ["B"] },
  { expect = ["B", "A"] },
  { expect = ["A"] },
  { expect = ["C", "A"] },
  { expect = ["A"] },
  { expect = "empty" },
]

