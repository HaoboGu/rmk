# Home row mods (HRM), ported from keyboard_morse_hrm_test.rs.
#
# For HRM, `enable_flow_tap` and `unilateral_tap` are enabled and
# `prior_idle_time` is considered.
#
# The morse fixture is the shared split board's home row, split across the
# halves so the hands differ: A@(1,0) and MT(B, LShift)@(1,1) on the left,
# MT(C, LGui)@(1,7), LT(1, D)@(1,8) and MT(E, LAlt)@(1,9) on the right, backed
# on layer 1 by Kp1..Kp5. The layer-off tests use the board's variant zone:
# MO(1)@(3,0), No@(3,1) (layer 1: B) and A@(3,2) (layer 1: Transparent).

keyboard = "boards/split.toml"

[behavior.morse]
enable_flow_tap = true
prior_idle_time = "120ms"
unilateral_tap = true
permissive_hold = true
hold_timeout = "250ms"
gap_timeout = "250ms"

[[behavior.morse.morses]]
morse_actions = [
  { pattern = "01", action = "A" },
  { pattern = "1000", action = "B" },
  { pattern = "1010", action = "C" },
  { pattern = "101", action = "K" },
  { pattern = "11", action = "M" },
  { pattern = "111", action = "O" },
  { pattern = "010", action = "R" },
  { pattern = "000", action = "S" },
]

[[test]]
name = "tap"
steps = [
  { delay = 150 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 100 },
  { release = [1, 1] },
  { expect = ["B"] },
  { expect = "empty" },
]

[[test]]
name = "hold"
steps = [
  { delay = 150 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 300 },
  { release = [1, 1] },   # Release after hold timeout
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

