  { delay = 10 },
  { release = [1, 8] },   # Release LT -> permissive hold
  { delay = 10 },
  { release = [1, 1] },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["D"] } },
  { expect = { mods = ["LShift"] } },
