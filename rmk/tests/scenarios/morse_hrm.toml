# Releasing a morse key must use the layer it was pressed on, even after that
# layer is switched off. The board's variant zone holds MO(1) / No / A over
# Transparent / B / Transparent, and each mode is checked in turn.
[[test]]
name = "release_morse_keeps_pressed_layer_no_action_after_layer_off_normal"
steps = [
  { delay = 10 },
  { press = [3, 0] },     # Press MO(1), layer 1 on
  { delay = 10 },
  { press = [3, 1] },     # Press B from layer 1
  { delay = 10 },
  { release = [3, 0] },   # Release MO(1), layer 1 off
  { delay = 10 },
  { release = [3, 1] },   # Release must use pressed-layer B, not layer 0 No
  { expect = ["B"] },
  { expect = "empty" },
]
[test.behavior.morse]
enable_flow_tap = false
unilateral_tap = false
permissive_hold = false
normal_mode = true

