# Same-hand roll in Normal mode: MT(B, LShift) (1,1) then A (1,0), both on the
# left half. The HRM tap must fire BEFORE the plain key so the roll comes out in
# the pressed order. Previously, Normal mode + unilateral_tap only resolved on
# key-release, causing the plain key to fire first (wrong order).
[[test]]
name = "normal_mode_same_hand_roll_order"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift) — HRM, Left hand
  { delay = 10 },
  { press = [1, 0] },     # Press A — plain key, Left hand (same-hand roll)
  { delay = 10 },
  { release = [1, 0] },
  { delay = 10 },
  { release = [1, 1] },
  { expect = ["B"] },
  { expect = ["B", "A"] },
  { expect = ["B"] },
  { expect = "empty" },
]
[test.behavior.morse]
enable_flow_tap = false
permissive_hold = false
normal_mode = true
