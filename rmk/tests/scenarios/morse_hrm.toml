# Releasing a morse key must use the layer it was pressed on, even after that
# layer is switched off. Row 0 is remapped to MO(1) / No / A over
# Transparent / B / Transparent, and each mode is checked in turn.
[[test]]
name = "release_morse_keeps_pressed_layer_no_action_after_layer_off_normal"
keys = [
  { layer = 0, row = 0, col = 0, action = "MO(1)" },
  { layer = 0, row = 0, col = 1, action = "No" },
  { layer = 0, row = 0, col = 2, action = "A" },
  { layer = 1, row = 0, col = 0, action = "_" },
  { layer = 1, row = 0, col = 1, action = "B" },
  { layer = 1, row = 0, col = 2, action = "_" },
]
steps = [
  { delay = 10 },
  { press = [0, 0] },     # Press MO(1), layer 1 on
  { delay = 10 },
  { press = [0, 1] },     # Press B from layer 1
  { delay = 10 },
  { release = [0, 0] },   # Release MO(1), layer 1 off
  { delay = 10 },
  { release = [0, 1] },   # Release must use pressed-layer B, not layer 0 No
  { expect = ["B"] },
  { expect = "empty" },
]
[test.behavior.morse]
enable_flow_tap = false
unilateral_tap = false
permissive_hold = false
normal_mode = true

