# Morse and tap-hold in the default Normal mode, ported from keyboard_morse_test.rs.
#
# The fixture sits on the shared split board's home row: A@(1,0),
# MT(B, LShift)@(1,1), TD(0)@(1,2), MT(C, LGui)@(1,7), LT(1, D)@(1,8), with
# keypad digits behind them on layer 1. No mode flags are set, so the defaults
# apply: Normal mode, 250 ms hold/gap timeouts.

keyboard = "boards/split.toml"

[[behavior.morse.morses]]
morse_actions = [
  { pattern = "01", action = "A" },
  { pattern = "1000", action = "B" },
  { pattern = "1010", action = "C" },
  { pattern = "101", action = "K" },
  { pattern = "11", action = "M" },
  { pattern = "111", action = "O" },
  { pattern = "010", action = "R" },
  { pattern = "000", action = "S" },
]

[[test]]
name = "morse_tap"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 100 },
  { release = [1, 1] },
  { expect = ["B"] },
  { expect = "empty" },
]

