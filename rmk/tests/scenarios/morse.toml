  { delay = 290 },
  { release = [1, 0] },
  { delay = 380 },
  { release = [1, 1] },   # Release B
  { delay = 400 },
  { release = [1, 7] },   # Release C
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift", "LGui"] } },
  { expect = { mods = ["LShift", "LGui"], keys = ["A"] } },
  { expect = { mods = ["LShift", "LGui"] } },
  { expect = { mods = ["LGui"] } },
  { expect = "empty" },
]

