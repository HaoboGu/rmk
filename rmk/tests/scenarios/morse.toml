# For normal mode, each morse key is resolved independently
[[test]]
name = "morse_rolling"
steps = [
  { delay = 30 },
  { press = [1, 0] },     # Press A
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 10 },
  { release = [1, 0] },   # Release A
  { delay = 30 },
  { press = [1, 8] },     # Press LT(1, D)
  { delay = 30 },
  { press = [1, 7] },     # Press MT(C, LGui)
  { delay = 100 },
  { release = [1, 8] },   # Release D
  { delay = 10 },
  { release = [1, 1] },   # Release B
  { delay = 150 },
  { release = [1, 7] },   # Release C (timeout)
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["D"] },
  { expect = "empty" },
  { expect = ["B"] },
  { expect = "empty" },
  { expect = { mods = ["LGui"] } },
  { expect = "empty" },
]

[[test]]
name = "morse_with_combo"
steps = [
  { delay = 20 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 60 },
  { press = [1, 7] },     # Press MT(C, LGui) — combo window expired
  { delay = 10 },
  { release = [1, 7] },   # Release C
  { delay = 300 },
  { release = [1, 1] },   # Release B
  { expect = ["C"] },
  { expect = "empty" },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]
[test.behavior.combo]
timeout = "50ms"
combos = [
  { actions = ["MT(B, LShift)", "MT(C, LGui)"], output = "X" },
]

[[test]]
name = "morse_with_combo_2"
