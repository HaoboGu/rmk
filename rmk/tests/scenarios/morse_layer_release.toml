# Releasing a morse key must use the action it resolved to on press, even once
# the layer that supplied that action is gone. Each case presses MO(1), presses
# a key through layer 1, drops the layer, then releases the key.
#
# The fixture is the shared split board's variant zone: MO(1)@(3,0),
# No@(3,1) (layer 1: B) and A@(3,2) (layer 1: Transparent). Every case runs the
# same timeline under a different resolution mode, so the one-line
# `behavior.morse` delta is the whole difference between them.

keyboard = "boards/split.toml"

[behavior.morse]
enable_flow_tap = false
unilateral_tap = false
permissive_hold = false

[[test]]
name = "no_action_normal_mode"
behavior.morse = { normal_mode = true }
steps = [
  { press = [3, 0] },    # Press MO(1), layer 1 on
  { press = [3, 1] },    # Press B from layer 1
  { release = [3, 0] },  # Release MO(1), layer 1 off
  { release = [3, 1] },  # Release must use pressed-layer B, not layer 0 No
]
expect = [["B"], []]

[[test]]
name = "no_action_normal_mode_after_timeout"
behavior.morse = { normal_mode = true }
steps = [
  { press = [3, 0] },    # Press MO(1), layer 1 on
  { press = [3, 1] },    # Press B from layer 1
  { delay = 240 },
  { release = [3, 0] },  # Release MO(1) after timeout, layer 1 off
  { release = [3, 1] },
]
expect = [["B"], []]

[[test]]
name = "no_action_permissive_hold"
behavior.morse = { permissive_hold = true }
steps = [
  { press = [3, 0] },    # Press MO(1), layer 1 on
  { press = [3, 1] },    # Press B from layer 1
  { release = [3, 0] },  # Release MO(1), layer 1 off
  { release = [3, 1] },  # Release must use pressed-layer B, not layer 0 No
]
expect = [["B"], []]

[[test]]
name = "no_action_hold_on_other_press"
behavior.morse = { hold_on_other_press = true }
steps = [
  { press = [3, 0] },    # Press MO(1), layer 1 on
  { press = [3, 1] },    # Press B from layer 1
  { release = [3, 0] },  # Release MO(1), layer 1 off
  { release = [3, 1] },
]
expect = [["B"], []]

# Transparent resolves through to layer 0 on press, and the release has to
# follow it there rather than re-resolving.
[[test]]
name = "transparent_action_normal_mode"
behavior.morse = { normal_mode = true }
steps = [
  { press = [3, 0] },    # Press MO(1), layer 1 on
  { press = [3, 2] },    # Press Transparent on layer 1 -> A from layer 0
  { release = [3, 0] },  # Release MO(1), layer 1 off
  { release = [3, 2] },
]
expect = [["A"], []]
