  { delay = 10 },
  { release = [1, 0] },   # Release A -> permissive hold
  { delay = 10 },
  { release = [1, 1] },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["A"] } },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

