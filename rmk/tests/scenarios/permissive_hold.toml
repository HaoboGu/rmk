[[test]]
name = "timeout_and_release_with_other_morse_key"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 200 },
  { press = [1, 7] },     # Press MT(C, LGui)
  { delay = 100 },
  { release = [1, 7] },   # Release C after both windows
  { delay = 100 },
  { release = [1, 1] },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["C"] } },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

[[test]]
name = "rolling_release_order"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 30 },
  { press = [1, 7] },     # Press MT(C, LGui)
  { delay = 30 },
  { press = [1, 0] },     # Press A
  { delay = 50 },
  { release = [1, 1] },   # Resolves B and A, but not C
  { delay = 100 },
  { release = [1, 7] },
  { delay = 100 },
  { release = [1, 0] },
  { expect = ["B"] },
  { expect = ["B", "A"] },
  { expect = ["A"] },
  { expect = ["C", "A"] },
  { expect = ["A"] },
  { expect = "empty" },
]

[[test]]
name = "rolling_release_order_2"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 30 },
  { press = [1, 7] },     # Press MT(C, LGui)
  { delay = 30 },
  { press = [1, 0] },     # Press A
  { delay = 100 },
  { release = [1, 7] },   # Triggers permissive hold of MT(B, LShift)
  { delay = 50 },
  { release = [1, 1] },
  { delay = 100 },
  { release = [1, 0] },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["C"] } },
  { expect = { mods = ["LShift"], keys = ["C", "A"] } },
  { expect = { mods = ["LShift"], keys = ["A"] } },
  { expect = ["A"] },
  { expect = "empty" },
]

[[test]]
name = "rolling_release_order_3"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 30 },
  { press = [1, 7] },     # Press MT(C, LGui)
  { delay = 30 },
  { press = [1, 0] },     # Press A
  { delay = 100 },
  { release = [1, 7] },   # Release C
  { delay = 100 },
  { release = [1, 0] },   # Release A
  { delay = 50 },
  { release = [1, 1] },   # Release B
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["C"] } },
  { expect = { mods = ["LShift"], keys = ["C", "A"] } },
  { expect = { mods = ["LShift"], keys = ["A"] } },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

[[test]]
name = "multiple_permissive_hold"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 30 },
  { press = [1, 7] },     # Press MT(C, LGui)
  { delay = 30 },
  { press = [1, 0] },     # Press A
  { delay = 100 },
  { release = [1, 0] },   # Release A -> both MTs resolve as hold
  { delay = 50 },
  { release = [1, 1] },
  { delay = 100 },
  { release = [1, 7] },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift", "LGui"] } },
  { expect = { mods = ["LShift", "LGui"], keys = ["A"] } },
  { expect = { mods = ["LShift", "LGui"] } },
  { expect = { mods = ["LGui"] } },
  { expect = "empty" },
]

[[test]]
name = "complex_rolling"
steps = [
  { delay = 30 },
  { press = [1, 0] },     # Press A
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 10 },
  { release = [1, 0] },   # Release A
  { delay = 30 },
  { press = [1, 8] },     # Press LT(1, D)
  { delay = 30 },
  { press = [1, 7] },     # Press MT(C, LGui)
  { delay = 100 },
  { release = [1, 8] },   # Release D
  { delay = 50 },
  { release = [1, 1] },   # Release B
  { delay = 10 },
  { release = [1, 7] },   # Release C
  { expect = ["A"] },
  { expect = "empty" },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["D"] } },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
  { expect = ["C"] },
  { expect = "empty" },
]

[[test]]
name = "flow_tap"
steps = [
  { delay = 30 },
  { press = [1, 0] },     # Press A
  { delay = 30 },
  { release = [1, 0] },
  { delay = 20 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 10 },
  { press = [1, 7] },     # Press MT(C, LGui)
  { delay = 40 },
  { release = [1, 1] },
  { delay = 10 },
  { release = [1, 7] },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["B"] },
  { expect = "empty" },
  { expect = ["C"] },
  { expect = "empty" },
]

# Ref: https://github.com/HaoboGu/rmk/pull/496
[[test]]
name = "previous_rolling_keypress"
steps = [
  { delay = 30 },
  { press = [1, 0] },     # Press A
  { delay = 20 },
  { press = [1, 8] },     # Press LT(1, D)
  { delay = 30 },
  { release = [1, 0] },   # Release A
  { delay = 20 },
  { press = [1, 1] },     # Press Kp2 on layer 1
  { delay = 40 },
  { release = [1, 1] },
  { delay = 10 },
  { release = [1, 8] },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["Kp2"] },
  { expect = "empty" },
]
