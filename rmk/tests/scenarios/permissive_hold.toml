[[test]]
name = "timeout_and_release"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 20 },
  { press = [1, 0] },     # Press A
  { delay = 260 },
  { release = [1, 0] },   # Release A after both windows
  { delay = 100 },
  { release = [1, 1] },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["A"] } },
  { expect = { mods = ["LShift"] } },
