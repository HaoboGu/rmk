  { actions = ["A", "MT(B, LShift)"], output = "Y" },
  { actions = ["MT(B, LShift)", "MT(C, LGui)", "LT(1, D)"], output = "Z" },
]

[[test]]
name = "timeout"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 260 },
  { press = [1, 0] },     # Press A after hold timeout
  { delay = 100 },
  { release = [1, 0] },
  { delay = 100 },
  { release = [1, 1] },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["A"] } },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

[[test]]
name = "quick_tap"
steps = [
  { delay = 10 },
  { press = [1, 0] },     # Press A
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 100 },
  { release = [1, 1] },
  { delay = 100 },
  { release = [1, 0] },
  { expect = ["A"] },
  { expect = ["A", "B"] },
  { expect = ["A"] },
  { expect = "empty" },
]

[[test]]
name = "multi_tap"
steps = [
  { delay = 10 },
  { press = [1, 0] },     # Press A
  { delay = 100 },
  { release = [1, 0] },
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 60 },
  { press = [1, 7] },     # Press MT(C, LGui)
  { delay = 60 },
  { release = [1, 1] },
  { delay = 60 },
  { release = [1, 7] },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["B"] },
  { expect = "empty" },
  { expect = ["C"] },
  { expect = "empty" },
]

[[test]]
name = "layer_tap"
steps = [
  { delay = 10 },
  { press = [1, 8] },     # Press LT(1, D)
  { delay = 10 },
  { press = [1, 1] },     # Press MT -> Kp2 on layer 1
  { delay = 100 },
  { release = [1, 1] },
  { delay = 10 },
  { release = [1, 8] },
  { delay = 10 },
  { press = [1, 0] },     # Press A
  { delay = 10 },
  { release = [1, 0] },
  { delay = 10 },
  { press = [1, 8] },     # Press LT(1, D)
  { delay = 10 },
  { press = [1, 1] },     # Press MT -> Kp2 on layer 1
  { delay = 100 },
  { release = [1, 1] },
  { delay = 10 },
  { release = [1, 8] },
  { expect = ["Kp2"] },
  { expect = "empty" },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["Kp2"] },
  { expect = "empty" },
]

[[test]]
name = "rolling_with_layer_tap"
steps = [
  { delay = 10 },
  { press = [1, 8] },     # Press LT(1, D)
  { delay = 10 },
  { press = [1, 0] },     # Press A
  { delay = 10 },
  { release = [1, 8] },   # Release LT first -> tap
  { delay = 10 },
  { release = [1, 0] },
  { delay = 250 },
  { press = [1, 8] },     # Press LT(1, D)
  { delay = 10 },
  { press = [1, 0] },     # Press A
  { delay = 10 },
  { release = [1, 0] },   # Release A -> permissive hold: Kp1
  { delay = 100 },
  { release = [1, 8] },
  { delay = 250 },
  { press = [1, 8] },     # Press LT(1, D)
  { delay = 10 },
  { press = [1, 0] },     # Press A
  { delay = 100 },
  { release = [1, 8] },   # Release LT first -> tap
  { delay = 10 },
  { release = [1, 0] },
  { expect = ["D"] },
  { expect = ["D", "A"] },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["Kp1"] },
  { expect = "empty" },
  { expect = ["D"] },
  { expect = ["D", "A"] },
  { expect = ["A"] },
  { expect = "empty" },
]

[[test]]
name = "timeout_rolled_release"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 260 },
  { press = [1, 0] },     # Press A after hold timeout
  { delay = 100 },
  { release = [1, 1] },   # Release B
  { delay = 100 },
  { release = [1, 0] },   # Release A
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["A"] } },
  { expect = ["A"] },
  { expect = "empty" },
]

