# Tap-hold in PermissiveHold mode, ported from keyboard_morse_permissive_hold_test.rs.
#
# The fixture sits on the shared split board's home row: A@(1,0),
# MT(B, LShift)@(1,1), TD(0)@(1,2), MT(C, LGui)@(1,7), LT(1, D)@(1,8), with
# keypad digits behind them on layer 1.

keyboard = "boards/split.toml"

[behavior.morse]
unilateral_tap = false
permissive_hold = true
hold_timeout = "250ms"
gap_timeout = "250ms"

[[behavior.morse.morses]]
morse_actions = [
  { pattern = "01", action = "A" },
  { pattern = "1000", action = "B" },
  { pattern = "1010", action = "C" },
  { pattern = "101", action = "K" },
  { pattern = "11", action = "M" },
  { pattern = "111", action = "O" },
  { pattern = "010", action = "R" },
  { pattern = "000", action = "S" },
]

[[test]]
name = "tap"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 100 },
  { release = [1, 1] },
  { expect = ["B"] },
  { expect = "empty" },
]

[[test]]
name = "hold"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 300 },
  { release = [1, 1] },   # Release after hold timeout
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

