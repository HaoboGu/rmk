# Alt-layout split board: a 36-key split (3x5 alphas + 3 thumbs per half)
# whose home row is morse/tap-hold keys, used by the rollover regressions in
# `morse_rollover.toml`. It replicates the real setup those bugs were reported
# on — the "dusk" letter arrangement on a Saurus split — so the alphas are
# deliberately not QWERTY.
#
# Left half is cols 0-4 (hand L), right half cols 5-9 (hand R) — the hands are
# what the layout's `unilateral_tap` profiles decide rolls on.
#
#   row 0        top alphas: L@(0,2) and O@(0,7) U@(0,8) Y@(0,9)
#   row 1        home row of morse keys: TD(0)@(1,0) TD(1)@(1,3) on the left,
#                TD(2)@(1,7) TD(3)@(1,8) TD(4)@(1,9) on the right. Each
#                scenario's morse table names them.
#   row 2        bottom alphas: D@(2,3)
#   row 3        thumbs
#
# (1,5) (1,6) (1,7) are three spellings of the same C key — the layer-tap
# `LT(1, C)`, and the tap-dance cell of each scenario's morse table (one table
# puts C at index 6, the other at index 2). One regression drives each
# spelling through the identical physical rollover.
#
# Layer 1 is what the morse holds switch to. (0,2) keeps the F2 backing the
# ported fixture had, so a roll that does resolve as hold still reads L's cell
# the way the original test did.

# Board-default morse timeouts plus every profile the scenario's morse tables
# name, from plain modes to the HRM variants the rollover reports used.
[behavior.morse]
hold_timeout = "250ms"
gap_timeout = "250ms"

[behavior.morse.profiles.normal]
normal_mode = true

[behavior.morse.profiles.hold_on_other]
hold_on_other_press = true

[behavior.morse.profiles.hrm_hold400]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"

[behavior.morse.profiles.hrm_gap250]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"
gap_timeout = "250ms"

[behavior.morse.profiles.hrm_gap100]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"
gap_timeout = "100ms"

[behavior.morse.profiles.hrm_gap100_no_flow]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"
gap_timeout = "100ms"
enable_flow_tap = false

[layout]
rows = 4
cols = 10
map = """
(0,0,L)  (0,1,L)  (0,2,L)  (0,3,L)  (0,4,L)  (0,5,R)  (0,6,R)  (0,7,R)  (0,8,R)  (0,9,R)
(1,0,L)  (1,1,L)  (1,2,L)  (1,3,L)  (1,4,L)  (1,5,R)  (1,6,R)  (1,7,R)  (1,8,R)  (1,9,R)
(2,0,L)  (2,1,L)  (2,2,L)  (2,3,L)  (2,4,L)  (2,5,R)  (2,6,R)  (2,7,R)  (2,8,R)  (2,9,R)
(3,0,L)  (3,1,L)  (3,2,L)  (3,3,L)  (3,4,L)  (3,5,R)  (3,6,R)  (3,7,R)  (3,8,R)  (3,9,R)
"""

[[keymap.layer]]
keys = """
Q      W   L       P      B      J                      F          O       U      Y
TD(0)  R   A       TD(1)  G      LT(1, C, hrm_hold400)  TD(6)      TD(2)   TD(3)  TD(4)
Z      X   M       D      V      K                      Quote      Comma   Dot    Slash
No     No  Escape  MO(1)  Space  Enter                  Backspace  Delete  No     No
"""

[[keymap.layer]]
keys = """
Grave  F1   F2   F3   F4   F5    F6    F7   F8     F9
Kc1    Kc2  Kc3  Kc4  Kc5  Kc6   Kc7   Kc8  Kc9    Kc0
No     No   No   No   No   Left  Down  Up   Right  No
No     No   No   _    No   No    No    No   No     No
"""
