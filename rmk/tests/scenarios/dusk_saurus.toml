# Real-layout rollover regressions, ported from keyboard_morse_tap_dance_test.rs.
#
# All four replay a roll over the home-row C of the `dusk` layout on a Saurus
# split, where the next letter must not overtake one that is already held. They
# differ only in how C is spelled: `TD(2)`@(1,7) in the Saurus morse table,
# `TD(6)`@(1,6) in the dusk one, and `LT(1, C)`@(1,5) as the tap-hold control.
#
# `dusk_hrm` is defined on the board, because the board's `LT(1, C, dusk_hrm)`
# cell names it; the other profiles are only named from the morse tables below.

keyboard = "boards/dusk.toml"

[behavior.morse]
unilateral_tap = false
hold_timeout = "250ms"
gap_timeout = "250ms"

[behavior.morse.profiles.dusk_normal]
normal_mode = true

[behavior.morse.profiles.dusk_hold_on_other]
hold_on_other_press = true

[behavior.morse.profiles.saurus_hrm]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"
gap_timeout = "250ms"

[behavior.morse.profiles.saurus_short_gap]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"
gap_timeout = "100ms"

[behavior.morse.profiles.saurus_short_gap_no_flow]
unilateral_tap = true
permissive_hold = true
hold_timeout = "400ms"
gap_timeout = "100ms"
enable_flow_tap = false

# Regression for a Saurus-shaped `dusk` layout while typing "client".
#
# The final `e`/`n`/`t` roll leaves `N` pressed before `T`, while `E` only
# resolves after `N` is already held. `T` then flow-taps because `E` just
# produced a simple keypress. Even when `N` disables flow-tap through a profile
# override, the later flow-tapped `T` must not overtake it, or the host sees
# "clietn".
[[test]]
name = "saurus_client_roll_with_flow_tap_override_keeps_n_before_t"
steps = [
  { delay = 150 },
  { tap = [1, 7, 30] },   # C
  { delay = 30 },
  { tap = [0, 2, 30] },   # L
  { delay = 30 },
  { tap = [1, 9, 30] },   # I
  { delay = 150 },
  { press = [1, 8] },     # E
  { delay = 40 },
  { press = [1, 0] },     # N
  { delay = 30 },
  { release = [1, 8] },
  { delay = 30 },
  { press = [1, 3] },     # T
  { delay = 30 },
  { release = [1, 0] },
  { delay = 30 },
  { release = [1, 3] },
  { delay = 300 },
  { tap = [0, 9, 30] },   # Y
  { expect = ["C"] },
  { expect = "empty" },
  { expect = ["L"] },
  { expect = "empty" },
  { expect = ["I"] },
  { expect = "empty" },
  { expect = ["E"] },
  { expect = "empty" },
  { expect = ["N"] },
  { expect = "empty" },
  { expect = ["T"] },
  { expect = "empty" },
  { expect = ["Y"] },
  { expect = "empty" },
]
[test.behavior.morse]
hold_on_other_press = false
normal_mode = true
enable_flow_tap = true
prior_idle_time = "120ms"
morses = [
  { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "saurus_short_gap_no_flow" },
  { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "saurus_hrm" },
  { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "saurus_hrm" },
  { tap = "E", hold = "RCtrl", hold_after_tap = "E", profile = "saurus_hrm" },
  { tap = "I", hold = "RShift", hold_after_tap = "I", profile = "saurus_short_gap" },
]

# Regression for the user's `dusk` layout rollover while typing "could".
#
# C is configured as TD(6) with tap=C and hold_after_tap=C. The physical
# rollover is C down, O down, C up, U down, O up, U up. C must not allow U to
# overtake the already-held O.
[[test]]
name = "dusk_tap_dance_cou_rollover_keeps_o_before_u"
steps = [
  { delay = 150 },
  { press = [1, 6] },     # C
  { delay = 30 },
  { press = [0, 7] },     # O
  { delay = 30 },
  { release = [1, 6] },
  { delay = 30 },
  { press = [0, 8] },     # U
  { delay = 30 },
  { release = [0, 7] },
  { delay = 30 },
  { release = [0, 8] },
  { delay = 30 },
  { tap = [0, 2, 30] },   # L
  { delay = 30 },
  { tap = [2, 3, 30] },   # D
  { expect = ["C"] },
  { expect = "empty" },
  { expect = ["O"] },
  { expect = ["O", "U"] },
  { expect = ["U"] },
  { expect = "empty" },
  { expect = ["L"] },
  { expect = "empty" },
  { expect = ["D"] },
  { expect = "empty" },
]
[test.behavior.morse]
hold_on_other_press = false
normal_mode = true
enable_flow_tap = true
prior_idle_time = "120ms"
morses = [
  { tap = "Tab", hold = "MO(1)", hold_after_tap = "Tab", profile = "dusk_normal" },
  { tap = "Space", hold = "MO(1)", hold_after_tap = "Space", profile = "dusk_hold_on_other" },
  { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "dusk_hrm" },
  { tap = "S", hold = "LCtrl", hold_after_tap = "S", profile = "dusk_hrm" },
  { tap = "H", hold = "LGui", hold_after_tap = "H", profile = "dusk_hrm" },
  { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "dusk_hrm" },
  { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "dusk_hrm" },
]

# Same C/O/U rollover, but U is delayed past the early-fired C gap timeout.
# Documents that the buffered O is flushed correctly once the gap timer expires
# before the next key arrives.
[[test]]
name = "dusk_tap_dance_cou_rollover_after_gap_timeout"
steps = [
  { delay = 150 },
  { press = [1, 6] },     # C
  { delay = 30 },
  { press = [0, 7] },     # O
  { delay = 30 },
  { release = [1, 6] },
  { delay = 300 },
  { press = [0, 8] },     # U
  { delay = 30 },
  { release = [0, 7] },
  { delay = 30 },
  { release = [0, 8] },
  { expect = ["C"] },
  { expect = "empty" },
  { expect = ["O"] },
  { expect = ["O", "U"] },
  { expect = ["U"] },
  { expect = "empty" },
]
[test.behavior.morse]
hold_on_other_press = false
normal_mode = true
enable_flow_tap = true
prior_idle_time = "120ms"
morses = [
  { tap = "Tab", hold = "MO(1)", hold_after_tap = "Tab", profile = "dusk_normal" },
  { tap = "Space", hold = "MO(1)", hold_after_tap = "Space", profile = "dusk_hold_on_other" },
  { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "dusk_hrm" },
  { tap = "S", hold = "LCtrl", hold_after_tap = "S", profile = "dusk_hrm" },
  { tap = "H", hold = "LGui", hold_after_tap = "H", profile = "dusk_hrm" },
  { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "dusk_hrm" },
  { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "dusk_hrm" },
]

# Control case: the same physical rollover over the tap-hold spelling of C,
# LT(1, C, dusk_hrm)@(1,5) instead of TD(6)@(1,6), keeps the text order correct.
[[test]]
name = "dusk_tap_hold_cou_rollover_keeps_o_before_u"
steps = [
  { delay = 150 },
  { press = [1, 5] },     # C
  { delay = 30 },
  { press = [0, 7] },     # O
  { delay = 30 },
  { release = [1, 5] },
  { delay = 30 },
  { press = [0, 8] },     # U
  { delay = 30 },
  { release = [0, 7] },
  { delay = 30 },
  { release = [0, 8] },
  { expect = ["C"] },
  { expect = ["C", "O"] },
  { expect = ["O"] },
  { expect = ["U", "O"] },
  { expect = ["U"] },
  { expect = "empty" },
]
[test.behavior.morse]
hold_on_other_press = false
normal_mode = true
enable_flow_tap = true
prior_idle_time = "120ms"
morses = [
  { tap = "Tab", hold = "MO(1)", hold_after_tap = "Tab", profile = "dusk_normal" },
  { tap = "Space", hold = "MO(1)", hold_after_tap = "Space", profile = "dusk_hold_on_other" },
  { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "dusk_hrm" },
  { tap = "S", hold = "LCtrl", hold_after_tap = "S", profile = "dusk_hrm" },
  { tap = "H", hold = "LGui", hold_after_tap = "H", profile = "dusk_hrm" },
  { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "dusk_hrm" },
  { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "dusk_hrm" },
]
