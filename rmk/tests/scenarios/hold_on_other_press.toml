# Tap-hold in HoldOnOtherPress mode, ported from keyboard_morse_hold_on_other_press_test.rs.
#
# The morse fixture is the shared split board's home row: A@(1,0),
# MT(B, LShift)@(1,1), MT(C, LGui)@(1,7), LT(1, D)@(1,8), backed on layer 1 by
# Kp1, Kp2, Kp3, Kp4. The per-key profile tests use the board's profile cells
# instead: TD(0)@(1,2), LT(1, D, p0)@(3,5), MT(B, LShift, p0)@(3,6),
# MT(B, LShift, p1)@(3,7) (layer 1: Kp1) and A@(3,2).

keyboard = "boards/split.toml"

[behavior.morse]
unilateral_tap = false
hold_on_other_press = true

[[test]]
name = "tap"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 100 },
  { release = [1, 1] },
  { expect = ["B"] },
  { expect = "empty" },
]

