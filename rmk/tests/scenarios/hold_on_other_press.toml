name = "hold"
steps = [
  { delay = 10 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 300 },
  { release = [1, 1] },   # Release after hold timeout
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

