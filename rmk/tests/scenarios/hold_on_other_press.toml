[[test]]
name = "with_combo_1"
steps = [
  { delay = 20 },
  { press = [1, 1] },     # Press MT(B, LShift)
  { delay = 60 },
  { press = [1, 7] },     # Press MT(C, LGui) — combo window expired
  { delay = 10 },
  { release = [1, 7] },   # Release C
  { delay = 300 },
  { release = [1, 1] },   # Release B
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["C"] } },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]
[test.behavior.combo]
timeout = "50ms"
combos = [
  { actions = ["MT(B, LShift)", "MT(C, LGui)"], output = "X" },
  { actions = ["A", "MT(B, LShift)"], output = "Y" },
  { actions = ["MT(B, LShift)", "MT(C, LGui)", "LT(1, D)"], output = "Z" },
]

