# The held LT(1, D) changes the layer under the next key, so its flow-tap
# decision must be re-taken against the key it actually resolves to.
[[test]]
name = "flow_tap_rechecks_current_key_after_held_key_changes_layer"
steps = [
  { delay = 30 },
  { tap = [3, 2, 30] },
  { delay = 20 },
  { press = [3, 5] },     # Press LT(1, D), flow tap disabled by p0
  { delay = 10 },
  { tap = [3, 7, 10] },   # Kp1 on layer 1, not the flow-tap-enabled MT
  { delay = 10 },
  { release = [3, 5] },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["Kp1"] },
  { expect = "empty" },
]
[test.behavior.morse]
enable_flow_tap = false
prior_idle_time = "120ms"
[test.behavior.morse.profiles.p0]
unilateral_tap = false
hold_on_other_press = true
hold_timeout = "250ms"
gap_timeout = "250ms"
enable_flow_tap = false
[test.behavior.morse.profiles.p1]
unilateral_tap = false
hold_on_other_press = true
hold_timeout = "250ms"
gap_timeout = "250ms"
enable_flow_tap = true

