# The per-key profile's `enable_flow_tap` wins over the global setting, both
# for a tap-hold key in the keymap and for a morse key (the two below).
[[test]]
name = "profile_flow_tap_true_overrides_global_false"
steps = [
  { delay = 30 },
  { tap = [1, 0, 30] },
  { delay = 20 },
  { press = [3, 6] },     # Press MT(B, LShift) with flow tap enabled by p0
  { delay = 10 },
  { tap = [1, 0, 10] },
  { delay = 10 },
  { release = [3, 6] },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["B"] },
  { expect = ["B", "A"] },
  { expect = ["B"] },
  { expect = "empty" },
]
