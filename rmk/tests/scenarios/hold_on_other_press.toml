# The per-key profile's `enable_flow_tap` wins over the global setting, both
# for a tap-hold key in the keymap and for a morse key (the two below).
[[test]]
name = "profile_flow_tap_true_overrides_global_false"
keys = [
  { layer = 0, row = 0, col = 0, action = "A" },
  { layer = 0, row = 0, col = 1, action = "MT(B, LShift, p0)" },
]
steps = [
  { delay = 30 },
  { tap = [0, 0, 30] },
  { delay = 20 },
  { press = [0, 1] },     # Press MT(B, LShift) with flow tap enabled by p0
  { delay = 10 },
  { tap = [0, 0, 10] },
  { delay = 10 },
  { release = [0, 1] },
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["B"] },
  { expect = ["B", "A"] },
  { expect = ["B"] },
  { expect = "empty" },
]
[test.behavior.morse]
enable_flow_tap = false
prior_idle_time = "120ms"
[test.behavior.morse.profiles.p0]
unilateral_tap = false
hold_on_other_press = true
hold_timeout = "250ms"
gap_timeout = "250ms"
enable_flow_tap = true

