# Keyboard macros, ported from keyboard_macro_test.rs.
#
# (0,0) triggers macro 0 and (0,1) triggers macro 1; each test brings its own
# macro set via [test.behavior.macro], and every test drives macro 0.
#
# `test_macro_with_delay` stays in keyboard_macro_test.rs: the codegen passes
# `duration` straight to `MacroOperation::Delay`, which is stored as Vial's
# packed byte pair, so `duration = "50ms"` plays back as 12495ms.
#
# The file stem is `macros`, not `macro`, because the generated module name
# cannot be a Rust keyword.

keyboard = "boards/test_keymap.toml"

[[keymap.layer]]
keys = """
MACRO(0)  MACRO(1)       Kc2          Kc3  Kc4  Kc5           Kc6  Kc7  Kc8    Kc9    Kc0        Minus        Equal         Backspace
Tab       Q              W            E    R    T             Y    U    I      O      P          LeftBracket  RightBracket  Backslash
Escape    TH(A, LShift)  TH(S, LGui)  D    F    G             H    J    K      L      Semicolon  Quote        No            Enter
LShift    TH(Z, LAlt)    X            C    V    B             N    M    Comma  Dot    Slash      No           No            RShift
LCtrl     LGui           LAlt         No   No   LT(1, Space)  No   No   No     MO(1)  RAlt       No           RGui          RCtrl
"""

[[keymap.layer]]
keys = """
Grave     F1  F2          F3             F4  F5  F6  F7  F8  F9  F10   F11  F12   Delete
No        _   E           W              No  No  No  No  No  No  No    No   No    No
CapsLock  No  No          No             No  No  No  No  No  No  No    No   No    No
No        No  SHIFTED(X)  WM(X, LShift)  No  No  No  No  No  No  No    No   No    Up
No        No  No          No             No  No  No  No  No  No  Left  No   Down  Right
"""

[[test]]
name = "macro_key_a_press_release"
steps = [
  { delay = 0 },
  { press = [0, 0] },     # Press macro 0
  { delay = 100 },
  { release = [0, 0] },
  { expect = ["A"] },     # Press A
  { expect = "empty" },   # Release A
]
[test.behavior.macro]
macros = [
  { operations = [
    { operation = "down", keycode = "A" },
    { operation = "up", keycode = "A" },
  ] },
]

[[test]]
name = "macro_text"
steps = [
  { delay = 0 },
  { press = [0, 0] },     # Press macro 0
  { delay = 100 },
  { release = [0, 0] },
  { expect = { mods = ["LShift"] } },               # Press shift
  { expect = { mods = ["LShift"], keys = ["A"] } }, # Press A + shift
  { expect = { mods = ["LShift"] } },               # Release A
  { expect = "empty" },                             # Release shift
  { expect = ["B"] },
  { expect = "empty" },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["C"] } },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
  { expect = ["D"] },
  { expect = "empty" },
  { expect = ["Kc1"] },
  { expect = "empty" },
  { expect = ["Kc2"] },
  { expect = "empty" },
  { expect = ["Kc3"] },
  { expect = "empty" },
  { expect = ["Kc4"] },
  { expect = "empty" },
  { expect = ["Kc5"] },
  { expect = "empty" },
  { expect = ["Kc6"] },
  { expect = "empty" },
]
[test.behavior.macro]
macros = [
  { operations = [{ operation = "text", text = "AbCd123456" }] },
]

[[test]]
name = "macro_tap_key_a"
steps = [
  { delay = 0 },
  { press = [0, 0] },     # Press macro 0
  { delay = 100 },
  { release = [0, 0] },
  { expect = ["A"] },     # Press A
  { expect = "empty" },   # Release A
]
[test.behavior.macro]
macros = [
  { operations = [{ operation = "tap", keycode = "A" }] },
]

[[test]]
name = "macro_multiple_operations"
steps = [
  { delay = 0 },
  { press = [0, 0] },     # Press macro 0
  { delay = 100 },
  { release = [0, 0] },
  { expect = { mods = ["LShift"] } },               # Press shift
  { expect = { mods = ["LShift"], keys = ["A"] } }, # Press shift + A
  { expect = { mods = ["LShift"] } },               # Release A
  { expect = "empty" },                             # Release shift
  { expect = ["B"] },
  { expect = "empty" },
]
[test.behavior.macro]
macros = [
  { operations = [
    { operation = "down", keycode = "LShift" },
    { operation = "tap", keycode = "A" },
    { operation = "up", keycode = "LShift" },
    { operation = "tap", keycode = "B" },
  ] },
]
