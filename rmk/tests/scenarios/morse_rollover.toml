# Rollover ordering on morse/tap-hold keys: when letters are rolled quickly across
# home-row morse keys, a later letter must never overtake one already held.
#
# All four tests replay real-world reports from the alt-layout split in
# boards/alt_layout_split.toml. They differ only in how the rolled C key is
# spelled: `TD(2)`@(1,7) and `TD(6)`@(1,6) in the two morse tables, and
# `LT(1, C)`@(1,5) as the tap-hold control.
#
# All profiles the morse tables name are defined on the board, next to the
# `LT(1, C, hrm_hold400)` cell that needs one at parse time.

keyboard = "boards/alt_layout_split.toml"

[behavior.morse]
unilateral_tap = false

# Regression reported while typing "client" on the alt-layout split.
#
# The final `e`/`n`/`t` roll leaves `N` pressed before `T`, while `E` only
# resolves after `N` is already held. `T` then flow-taps because `E` just
# produced a simple keypress. Even when `N` disables flow-tap through a profile
# override, the later flow-tapped `T` must not overtake it, or the host sees
# "clietn".
[[test]]
name = "client_roll_with_flow_tap_override_keeps_n_before_t"
behavior.morse = {
  hold_on_other_press = false,
  normal_mode = true,
  enable_flow_tap = true,
  prior_idle_time = "120ms",
  morses = [
    { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "hrm_gap100_no_flow" },
    { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "hrm_gap250" },
    { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "hrm_gap250" },
    { tap = "E", hold = "RCtrl", hold_after_tap = "E", profile = "hrm_gap250" },
    { tap = "I", hold = "RShift", hold_after_tap = "I", profile = "hrm_gap100" },
  ]
}
steps = [
  { delay = 150 },
  { tap = { pos = [1, 7], duration = 30 } },
  { delay = 30 },
  { tap = { pos = [0, 2], duration = 30 } },
  { delay = 30 },
  { tap = { pos = [1, 9], duration = 30 } },
  { delay = 150 },
  { press = [1, 8] },  # E
  { delay = 40 },
  { press = [1, 0] },  # N
  { delay = 30 },
  { release = [1, 8] },
  { delay = 30 },
  { press = [1, 3] },  # T
  { delay = 30 },
  { release = [1, 0] },
  { delay = 30 },
  { release = [1, 3] },
  { delay = 300 },
  { tap = { pos = [0, 9], duration = 30 } },
]
expect = [["C"], [], ["L"], [], ["I"], [], ["E"], [], ["N"], [], ["T"], [], ["Y"], []]

# Regression reported while typing "could" on the alt-layout split.
#
# C is configured as TD(6) with tap=C and hold_after_tap=C. The physical
# rollover is C down, O down, C up, U down, O up, U up. C must not allow U to
# overtake the already-held O.
[[test]]
name = "tap_dance_cou_rollover_keeps_o_before_u"
behavior.morse = {
  hold_on_other_press = false,
  normal_mode = true,
  enable_flow_tap = true,
  prior_idle_time = "120ms",
  morses = [
    { tap = "Tab", hold = "MO(1)", hold_after_tap = "Tab", profile = "normal" },
    { tap = "Space", hold = "MO(1)", hold_after_tap = "Space", profile = "hold_on_other" },
    { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "hrm_hold400" },
    { tap = "S", hold = "LCtrl", hold_after_tap = "S", profile = "hrm_hold400" },
    { tap = "H", hold = "LGui", hold_after_tap = "H", profile = "hrm_hold400" },
    { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "hrm_hold400" },
    { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "hrm_hold400" },
  ]
}
steps = [
  { delay = 150 },
  { press = [1, 6] },  # C
  { delay = 30 },
  { press = [0, 7] },  # O
  { delay = 30 },
  { release = [1, 6] },
  { delay = 30 },
  { press = [0, 8] },  # U
  { delay = 30 },
  { release = [0, 7] },
  { delay = 30 },
  { release = [0, 8] },
  { delay = 30 },
  { tap = { pos = [0, 2], duration = 30 } },
  { delay = 30 },
  { tap = { pos = [2, 3], duration = 30 } },
]
expect = [["C"], [], ["O"], ["O", "U"], ["U"], [], ["L"], [], ["D"], []]

# Same C/O/U rollover, but U is delayed past the early-fired C gap timeout.
# Documents that the buffered O is flushed correctly once the gap timer expires
# before the next key arrives.
[[test]]
name = "tap_dance_cou_rollover_after_gap_timeout"
behavior.morse = {
  hold_on_other_press = false,
  normal_mode = true,
  enable_flow_tap = true,
  prior_idle_time = "120ms",
  morses = [
    { tap = "Tab", hold = "MO(1)", hold_after_tap = "Tab", profile = "normal" },
    { tap = "Space", hold = "MO(1)", hold_after_tap = "Space", profile = "hold_on_other" },
    { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "hrm_hold400" },
    { tap = "S", hold = "LCtrl", hold_after_tap = "S", profile = "hrm_hold400" },
    { tap = "H", hold = "LGui", hold_after_tap = "H", profile = "hrm_hold400" },
    { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "hrm_hold400" },
    { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "hrm_hold400" },
  ]
}
steps = [
  { delay = 150 },
  { press = [1, 6] },  # C
  { delay = 30 },
  { press = [0, 7] },  # O
  { delay = 30 },
  { release = [1, 6] },
  { delay = 300 },
  { press = [0, 8] },  # U
  { delay = 30 },
  { release = [0, 7] },
  { delay = 30 },
  { release = [0, 8] },
]
expect = [["C"], [], ["O"], ["O", "U"], ["U"], []]

# Control case: the same physical rollover over the tap-hold spelling of C,
# LT(1, C, hrm_hold400)@(1,5) instead of TD(6)@(1,6), keeps the text order correct.
[[test]]
name = "tap_hold_cou_rollover_keeps_o_before_u"
behavior.morse = {
  hold_on_other_press = false,
  normal_mode = true,
  enable_flow_tap = true,
  prior_idle_time = "120ms",
  morses = [
    { tap = "Tab", hold = "MO(1)", hold_after_tap = "Tab", profile = "normal" },
    { tap = "Space", hold = "MO(1)", hold_after_tap = "Space", profile = "hold_on_other" },
    { tap = "N", hold = "LShift", hold_after_tap = "N", profile = "hrm_hold400" },
    { tap = "S", hold = "LCtrl", hold_after_tap = "S", profile = "hrm_hold400" },
    { tap = "H", hold = "LGui", hold_after_tap = "H", profile = "hrm_hold400" },
    { tap = "T", hold = "MO(1)", hold_after_tap = "T", profile = "hrm_hold400" },
    { tap = "C", hold = "MO(1)", hold_after_tap = "C", profile = "hrm_hold400" },
  ]
}
steps = [
  { delay = 150 },
  { press = [1, 5] },  # C
  { delay = 30 },
  { press = [0, 7] },  # O
  { delay = 30 },
  { release = [1, 5] },
  { delay = 30 },
  { press = [0, 8] },  # U
  { delay = 30 },
  { release = [0, 7] },
  { delay = 30 },
  { release = [0, 8] },
]
expect = [["C"], ["C", "O"], ["O"], ["U", "O"], ["U"], []]
