# Layer switching: LM release ordering and PDF default-layer selection, on the
# shared split board's PDF/LM zone: PDF(1)@(0,10), A@(0,11) (layer 1: B),
# LM(1, LShift)@(0,12).
#
# `test_pdf_invalid_layer_is_ignored` stays in keyboard_layer_test.rs: it needs
# an out-of-range PDF target, which config validation (correctly) rejects here.

keyboard = "boards/split.toml"

[[test]]
name = "lm_release"
steps = [
  { delay = 0 },
  { press = [0, 12] },       # LM(1, LShift): layer 1 + LShift
  { delay = 100 },
  { press = [0, 11] },       # B on layer 1
  { delay = 100 },
  { release = [0, 11] },
  { delay = 0 },
  { release = [0, 12] },
  { expect = { mods = ["LShift"] } },
  { expect = { mods = ["LShift"], keys = ["B"] } },
  { expect = { mods = ["LShift"] } },
  { expect = "empty" },
]

[[test]]
name = "pdf_sets_default_layer"
steps = [
  { tap = [0, 11, 10] },     # A on layer 0
  { tap = [0, 10, 10] },     # PDF(1): default layer becomes 1
  { tap = [0, 11, 10] },     # B on layer 1
  { expect = ["A"] },
  { expect = "empty" },
  { expect = ["B"] },
  { expect = "empty" },
]
