[keyboard]
name = "RMK nRF52840 Keyboard"
product_name = "My RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Haobo"
chip = "nrf52840"

[layout]
rows = 4
cols = 3
layers = 1
matrix_map = """
(0,0) (0,1) (0,2)
(1,0) (1,1) (1,2)
(2,0) (2,1) (2,2)
(3,0) (3,1) (3,2)
"""

[[layer]]
name = "base_layer"
keys = """
Kp7 Kp8 Kp9
Kp4 Kp5 Kp6
Kp1 Kp2 Kp3
    Kp0
"""

[host]
vial_enabled = false

[usb]
enabled = true

[ble]
enabled = true

[dfu]
led = "P0_15"
unlock_keys = [[0, 0]]

[split]
connection = "ble"

[split.central]
rows = 2
cols = 2
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_07", "P0_22"]
col_pins = ["P0_13", "P0_17"]

[[split.peripheral]]
rows = 2
cols = 1
row_offset = 2
col_offset = 2
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_07", "P0_22"]
col_pins = ["P0_13"]

[chip.nrf52840]
dcdc_reg0 = true
dcdc_reg1 = true
dcdc_reg0_voltage = "3V3"
